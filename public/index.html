<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roast Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F8F0E0;
  --surface:#FFFFFF;
  --ink:#173F37;
  --ink-soft:#77897C;
  --accent:#1F5D4E;
  --accent-soft:#DCEAE3;
  --gold:#E0982A;
  --good:#5C7A4A;
  --mid:#B98A3D;
  --low:#9C4A3B;
  --line:#E1D9C3;
}
*{box-sizing:border-box;}
html,body{ margin:0; padding:0; }
body{
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background:var(--bg);
  color:var(--ink);
}
h1,h2,h3{ font-family:'Poppins',system-ui,sans-serif; font-weight:800; margin:0; }
.app-root{
  min-height:100vh;
  display:flex;
  position:relative;
}
.app-content{
  flex:1;
  max-width:560px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  width:100%;
}
.sidebar{ display:none; }
.topbar{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
.logo{ height:34px; width:34px; display:block; border-radius:50%; flex-shrink:0; }
.topbar-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:1.1rem; color:var(--ink); }
.main{ flex:1; padding:16px 16px 100px; overflow-y:auto; }
.loading{ padding:60px 0; text-align:center; color:var(--ink-soft); font-style:italic; }

.empty-state{ text-align:center; padding:60px 24px; }
.empty-icon{ font-size:1.4rem; letter-spacing:3px; color:var(--gold); margin-bottom:12px; }
.empty-state h2{ font-size:1.3rem; margin-bottom:6px; }
.empty-state p{ color:var(--ink-soft); margin:0 0 18px; }

.btn{ border:none; border-radius:3px; padding:12px 20px; font-size:0.95rem; cursor:pointer; font-family:inherit; }
.btn-primary{ background:var(--accent); color:var(--surface); width:100%; }
.btn-primary:active{ opacity:0.85; }
.btn-danger{ background:var(--low); color:var(--surface); width:100%; margin-top:10px; }
.btn-ghost-danger{ background:none; color:var(--low); border:1px solid var(--low); width:100%; margin-top:10px; display:flex; gap:6px; align-items:center; justify-content:center; }
.btn-small{ background:var(--accent-soft); color:var(--ink); border:none; border-radius:3px; padding:8px 12px; font-size:0.85rem; cursor:pointer; }
.btn-link{ background:none; border:none; color:var(--accent); font-size:0.82rem; cursor:pointer; padding:4px 0; text-align:center; text-decoration:underline; text-underline-offset:2px; align-self:center; display:block; margin:0 auto; }

.controls{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.search-box{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:9px 12px; color:var(--ink-soft); }
.search-box input{ border:none; background:none; outline:none; font-size:0.95rem; color:var(--ink); width:100%; }
.control-row{ display:flex; gap:8px; }
.control-row select{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:9px 12px; font-size:0.95rem; color:var(--ink); }

.card-list{ display:flex; flex-direction:column; gap:10px; }
.coffee-card{
  display:flex; gap:12px; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:3px; padding:12px;
  cursor:pointer; font-family:inherit; color:inherit; width:100%;
}
.card-thumb{
  width:56px; aspect-ratio:4/6; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:var(--surface); font-family:'Poppins',sans-serif; font-weight:700; font-size:1.3rem; overflow:hidden;
  border-radius:3px;
}
.card-thumb img{ width:100%; height:100%; object-fit:cover; }
.card-body{ flex:1; min-width:0; }
.card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.card-top h3{ font-size:1.02rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-rating{ font-family:'Poppins',sans-serif; font-size:1.15rem; font-weight:700; flex-shrink:0; }
.card-sub{ margin:2px 0 6px; font-size:0.83rem; color:var(--ink-soft); }
.card-tags{ display:flex; flex-wrap:wrap; gap:5px; }
.tag-outline{ font-size:0.72rem; border:1px solid var(--line); border-radius:3px; padding:2px 7px; color:var(--ink-soft); }
.tag-note{ font-size:0.72rem; background:var(--accent-soft); border-radius:3px; padding:2px 7px; color:var(--ink); }
.no-results{ text-align:center; color:var(--ink-soft); padding:30px 0; }

.categories-wrap{ display:flex; flex-direction:column; gap:28px; }
.status-section{ display:flex; flex-direction:column; gap:12px; }
.status-heading{ font-size:1.05rem; display:flex; align-items:baseline; gap:8px; }
.status-count{ font-size:0.8rem; font-weight:500; color:var(--ink-soft); }

.tabbar{
  position:sticky; bottom:0; display:flex; background:var(--surface);
  border-top:1px solid var(--line); max-width:560px; margin:0 auto; width:100%;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:10px 0 8px; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.7rem; font-family:inherit;
}
.tab.active{ color:var(--accent); }
.tab-add{ color:var(--accent); }
.tab svg{ display:block; }

.toast{
  position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--surface); padding:9px 18px; border-radius:3px; font-size:0.85rem; z-index:10;
  opacity:0; pointer-events:none; transition:opacity 0.2s ease;
}
.toast.visible{ opacity:1; }
.toast.toast-error{ background:var(--low); }

.entry-form{ display:flex; flex-direction:column; gap:4px; }
.form-header{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.form-header h2{ font-size:1.2rem; }
.icon-btn{ background:none; border:none; color:var(--ink); cursor:pointer; padding:4px; display:flex; }

.form-section{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:16px; margin-bottom:12px; display:flex; flex-direction:column; gap:12px; }
.form-section h3{ font-size:1rem; border-bottom:1px solid var(--line); padding-bottom:8px; }

.field{ display:flex; flex-direction:column; gap:5px; font-size:0.85rem; flex:1; }
.field-label{ color:var(--ink-soft); }
.field-pair{ display:flex; gap:10px; }
input,select,textarea{
  font-family:inherit; font-size:0.95rem; padding:9px 10px; border:1px solid var(--line);
  border-radius:3px; background:#fff; color:var(--ink); width:100%;
}
input[type=range]{ padding:0; accent-color:var(--accent); }
textarea{ resize:vertical; }
.computed{ padding:9px 10px; background:var(--accent-soft); border-radius:3px; font-variant-numeric:tabular-nums; }
.field-error{ color:var(--low); font-size:0.8rem; margin:4px 0 0; }

.currency-input{ display:flex; align-items:center; border:1px solid var(--line); border-radius:3px; background:#fff; }
.currency-input span{ padding:0 0 0 10px; color:var(--ink-soft); font-size:0.95rem; }
.currency-input input{ border:none; padding-left:4px; }

.segmented{ display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
.seg{ flex:1; padding:9px 0; background:#fff; border:none; font-size:0.85rem; cursor:pointer; color:var(--ink-soft); font-family:inherit; }
.seg.active{ background:var(--accent); color:var(--surface); }
.seg + .seg{ border-left:1px solid var(--line); }

.roast-scale{ display:flex; justify-content:space-between; gap:4px; }
.roast-dot{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; flex:1; padding:4px 0; }
.roast-dot .dot{ width:18px; height:18px; border-radius:50%; border:2px solid transparent; }
.roast-dot.active .dot{ border-color:var(--ink); }
.roast-label{ font-size:0.6rem; color:var(--ink-soft); text-align:center; line-height:1.1; }

.photo-row{ display:flex; gap:10px; flex-wrap:wrap; }
.photo-thumb{ position:relative; width:72px; height:72px; border-radius:3px; overflow:hidden; border:1px solid var(--line); }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-thumb button{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.55); color:#fff; border:none; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.photo-add{ width:72px; height:72px; border:1px dashed var(--line); border-radius:3px; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-soft); cursor:pointer; font-size:0.68rem; font-family:inherit; }

.photo-url-row{ display:flex; gap:8px; }
.note-input-row{ display:flex; gap:8px; }
.suggestions{ display:flex; flex-wrap:wrap; gap:6px; }
.suggestions button{ background:none; border:1px dashed var(--line); border-radius:3px; padding:4px 9px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer; }
.note-pills{ display:flex; flex-wrap:wrap; gap:6px; }
.note-pill{ background:var(--accent-soft); border-radius:3px; padding:4px 6px 4px 10px; font-size:0.8rem; display:flex; align-items:center; gap:6px; }
.note-pill button{ background:none; border:none; color:var(--ink-soft); cursor:pointer; display:flex; }

.form-actions{ margin:6px 0 20px; }

.top-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
.top-row > .form-section{ flex:1 1 260px; margin-bottom:0; }
.side-col{ display:flex; flex-direction:column; gap:12px; flex:1 1 260px; }
.side-col .form-section{ margin-bottom:0; }

.view-value{ padding:9px 0 2px; color:var(--ink); font-size:0.95rem; }
.view-empty{ color:var(--ink-soft); font-size:0.85rem; font-style:italic; margin:2px 0 0; }
.view-roast{ display:flex; align-items:center; gap:8px; }
.view-roast .dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.photo-thumb-static{ cursor:default; }
.note-pill-static{ padding:4px 10px; }

.detail-photo-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; }
.detail-photo{ width:100%; aspect-ratio:4/6; border-radius:4px; overflow:hidden; border:1px solid var(--line); }
.detail-photo img{ display:block; width:100%; height:100%; object-fit:cover; }

.stats{ display:flex; flex-direction:column; gap:14px; }
.hero-stats{ display:flex; gap:10px; }
.hero-card{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:16px 8px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.hero-num{ font-family:'Poppins',sans-serif; font-weight:700; font-size:1.7rem; font-variant-numeric:tabular-nums; }
.hero-label{ font-size:0.7rem; color:var(--ink-soft); }

.stat-block{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:16px; }
.stat-block h3{ font-size:0.95rem; margin-bottom:12px; }

.bar-chart{ display:flex; flex-direction:column; gap:8px; }
.bar-row{ display:flex; align-items:center; gap:8px; font-size:0.78rem; }
.bar-label{ width:78px; flex-shrink:0; color:var(--ink-soft); }
.bar-track{ flex:1; background:var(--bg); border-radius:2px; height:9px; overflow:hidden; }
.bar-fill{ height:100%; background:var(--accent); border-radius:2px; }
.bar-value{ width:28px; text-align:right; font-variant-numeric:tabular-nums; }

.split-bar{ display:flex; height:26px; border-radius:3px; overflow:hidden; }
.split-seg{ background:var(--accent); color:var(--surface); display:flex; align-items:center; justify-content:center; font-size:0.8rem; }
.split-seg-alt{ background:var(--accent-soft); color:var(--ink); }
.split-legend{ display:flex; justify-content:space-between; font-size:0.75rem; color:var(--ink-soft); margin-top:6px; }

.roster-list{ display:flex; flex-direction:column; gap:8px; }
.roster-row{ display:flex; align-items:center; gap:8px; font-size:0.85rem; }
.roster-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.roster-count{ color:var(--ink-soft); font-size:0.75rem; }
.roster-avg{ font-family:'Poppins',sans-serif; font-weight:700; width:30px; text-align:right; }

.note-cloud{ display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
.cloud-tag{ background:var(--bg); border-radius:3px; padding:3px 9px; color:var(--ink); }

.cuplog-list{ display:flex; flex-direction:column; gap:10px; }
.cuplog-row{ border:1px solid var(--line); border-radius:3px; padding:10px 12px; }
.cuplog-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:0.85rem; }
.cuplog-meta{ color:var(--ink-soft); }
.cuplog-rating{ font-family:'Poppins',sans-serif; font-weight:700; font-size:1rem; flex-shrink:0; }
.cuplog-notes{ margin:6px 0 0; font-size:0.85rem; color:var(--ink); }

/* ---------- desktop layout ---------- */
@media (min-width: 860px){
  .app-root{ max-width:none; }
  .app-content{ max-width:none; margin:0; }
  .topbar{ display:none; }
  .tabbar{ display:none !important; }

  .sidebar{
    display:flex; flex-direction:column; gap:6px;
    width:240px; flex-shrink:0; padding:28px 18px;
    background:var(--surface); border-right:1px solid var(--line);
    position:sticky; top:0; height:100vh;
  }
  .sidebar-top{ display:flex; justify-content:center; margin-bottom:26px; }
  .sidebar-logo{ width:100%; height:auto; border-radius:50%; display:block; }
  .sidebar-nav{ display:flex; flex-direction:column; gap:2px; margin-bottom:18px; }
  .sidebar-nav .nav-btn{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:10px 12px; border-radius:4px; background:none; border:none;
    color:var(--ink-soft); font-size:0.9rem; font-family:inherit; cursor:pointer; text-align:left;
  }
  .sidebar-nav .nav-btn:hover{ background:var(--bg); }
  .sidebar-nav .nav-btn.active{ background:var(--accent-soft); color:var(--ink); }
  .sidebar-add{ margin-top:auto; }
  .sidebar-logout{ margin-top:10px; }

  .main{ max-width:1180px; margin:0 auto; padding:36px 44px 60px; width:100%; }

  /* Amazon-style card grid: photo on top, info below, priority on the image */
  .card-list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:22px;
  }
  .coffee-card{
    flex-direction:column; align-items:stretch; padding:0; overflow:hidden;
  }
  .coffee-card:hover{ border-color:var(--accent); box-shadow:0 2px 10px rgba(59,36,20,0.08); }
  .card-thumb{
    width:100%; aspect-ratio:4/6; border-radius:0; font-size:2.6rem;
  }
  .card-body{ padding:14px 16px 16px; }
  .card-top h3{ white-space:normal; }

  .controls{ flex-direction:row; align-items:center; flex-wrap:wrap; }
  .search-box{ flex:1; min-width:220px; }
  .control-row{ flex:0 0 auto; }

  /* wider two-column form on desktop */
  .entry-form{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-content:start; max-width:1000px; margin:0 auto; }
  .entry-form.detail-view{ display:flex; flex-direction:column; max-width:900px; }
  .form-header{ grid-column:1 / -1; }
  .form-actions{ grid-column:1 / -1; max-width:360px; }

  /* stats can breathe on desktop */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:16px; align-items:start; }
  .hero-stats{ grid-column:1 / -1; }
}
</style>
</head>
<body>

<div class="app-root">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <img class="sidebar-logo" src="/logo.webp" alt="Roast Report" />
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn" data-view="overview">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-btn" data-view="stats">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>
        <span>Stats</span>
      </button>
    </nav>
    <button class="btn btn-primary sidebar-add" data-view="form-new">+ New coffee</button>
    <button class="btn btn-ghost-danger sidebar-logout" id="sidebar-logout-btn" type="button">Log out</button>
  </aside>

  <div class="app-content">
    <header class="topbar">
      <img class="logo" src="/logo.webp" alt="Roast Report" />
      <span class="topbar-title">Roast Report</span>
    </header>

    <main class="main" id="main"></main>

    <nav class="tabbar" id="tabbar" style="display:none;">
      <button class="tab nav-btn" data-view="overview">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Overview</span>
      </button>
      <button class="tab tab-add nav-btn" data-view="form-new">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add</span>
      </button>
      <button class="tab nav-btn" data-view="stats">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>
        <span>Stats</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* Standalone hosting: window.storage (Claude-artifact API) is not available here.
   This shim backs it with the browser's localStorage so persistence still works
   when the app is hosted as a normal static site. */
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v !== null ? { key, value: v, shared: false } : null;
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  },
};
/* ---------- constants ---------- */

const COUNTRIES = [
  "Ethiopia", "Kenya", "Colombia", "Brazil", "Guatemala", "Costa Rica",
  "Honduras", "Peru", "Rwanda", "Burundi", "Indonesia", "Yemen", "Panama",
  "El Salvador", "Mexico", "Nicaragua", "India", "Vietnam", "Uganda",
  "Tanzania", "Other",
];
const ROAST_LEVELS = ["Light", "Light-Medium", "Medium", "Medium-Dark", "Dark"];
const PROCESSING = ["Washed", "Natural", "Honey", "Other"];
const BREW_METHODS = ["Pour Over", "Espresso", "French Press", "Aeropress", "Moka Pot", "Drip Machine", "Cold Brew", "Other"];
const TYPES = ["Whole Beans", "Ground"];
const STATUSES = ["Currently Brewing", "Pantry", "Wishlist", "Past Roast"];
const STATUS_LABELS = { "Past Roast": "Past Roasts" };
const STORAGE_KEY = "cuplog-entries";
const MAX_PHOTOS = 3;

const ROAST_DOT = {
  "Light": "#D9B36C",
  "Light-Medium": "#C08F4C",
  "Medium": "#9C6B36",
  "Medium-Dark": "#6E4526",
  "Dark": "#3A2417",
};

const ICONS = {
  camera: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  search: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',
  trash: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>',
};


/* ---------- helpers ---------- */

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function emptyEntry() {
  return {
    id: null,
    status: "Wishlist",
    name: "", company: "", boughtFrom: "", type: "Whole Beans",
    price: "", bagSize: "", photos: [], photoThumbs: [],
    originCountry: "", originRegion: "", singleOrigin: true, blendMix: "",
    roastLevel: "Medium", processing: "Washed", varietal: "", altitude: "",
    tastingNotes: [],
    rating: null, brewMethod: "Pour Over", dateTried: new Date().toISOString().slice(0, 10),
    cupsBrewed: 1,
    notes: "",
    cupLog: [],
    dateLogged: null,
  };
}

function statusOf(e) {
  return e.status || "Past Roast";
}

function mostRecentCupDate(e) {
  const log = cupLogOf(e);
  const dates = log.map((c) => c.dateTried).filter(Boolean);
  if (dates.length) return dates.reduce((a, b) => (a > b ? a : b));
  return e.dateTried || null;
}

function applyAutoStatusTransitions() {
  let changed = false;
  const now = Date.now();
  (entries || []).forEach((e) => {
    if (statusOf(e) === "Currently Brewing") {
      const last = mostRecentCupDate(e);
      if (last) {
        const days = (now - new Date(last).getTime()) / 86400000;
        if (days > 30) { e.status = "Past Roast"; changed = true; }
      }
    }
  });
  return changed;
}

function cupLogOf(e) {
  if (e.cupLog !== undefined) return e.cupLog;
  if (e.rating != null && e.rating !== "") {
    return [{
      id: "legacy", rating: e.rating, brewMethod: e.brewMethod,
      dateTried: e.dateTried, cupsBrewed: e.cupsBrewed, notes: e.notes,
      loggedAt: e.dateLogged || null,
    }];
  }
  return [];
}

function overallRating(e) {
  const log = cupLogOf(e);
  if (!log.length) return null;
  const sum = log.reduce((a, c) => a + (parseFloat(c.rating) || 0), 0);
  return sum / log.length;
}

function totalCupsBrewed(e) {
  return cupLogOf(e).reduce((a, c) => a + (parseFloat(c.cupsBrewed) || 0), 0);
}

function pricePerCup(e) {
  const total = totalCupsBrewed(e);
  const p = parseFloat(e.price);
  if (!p || !total) return null;
  return p / total;
}

function pricePer100g(price, bagSize) {
  const p = parseFloat(price), s = parseFloat(bagSize);
  if (!p || !s) return null;
  return (p / s) * 100;
}

function ratingColor(r) {
  if (r == null) return "var(--ink-soft)";
  if (r < 5) return "var(--low)";
  if (r < 8) return "var(--mid)";
  return "var(--good)";
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[m]));
}

function drawScaled(img, maxW, quality) {
  const scale = Math.min(1, maxW / img.width);
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", quality);
}

// Produces two sizes from one upload: a larger "full" image for the detail
// page, and a small purpose-built "thumb" for the Overview grid. Overview
// cards used to downscale the full image on the fly, which on a big
// shrink ratio makes photos look harsh/over-sharpened; rendering a thumb
// close to its actual display size avoids that.
function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load image"));
      img.onload = () => {
        try {
          const full = drawScaled(img, 1280, 0.85);
          const thumb = drawScaled(img, 560, 0.85);
          resolve({ full, thumb });
        } catch (err) {
          reject(err);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Best-effort thumbnail for a pasted image URL. Canvas export can fail
// (tainted canvas) for URLs without permissive CORS headers; in that case
// we just fall back to using the original URL for both sizes.
function makeThumbFromUrl(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onerror = () => resolve(url);
    img.onload = () => {
      try {
        resolve(drawScaled(img, 560, 0.85));
      } catch (err) {
        resolve(url);
      }
    };
    img.src = url;
  });
}

/* ---------- state ---------- */

let entries = null;
let view = "overview";       // "overview" | "form" | "stats"
let editId = null;
let draft = null;            // working copy of entry while in form view
let toastTimer = null;

const mainEl = document.getElementById("main");
const tabbarEl = document.getElementById("tabbar");
const toastEl = document.getElementById("toast");

/* ---------- persistence ---------- */

function goToLogin() {
  location.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search);
}

async function loadEntries() {
  try {
    const res = await fetch("/api/coffees");
    if (res.status === 401) { goToLogin(); return false; }
    const data = res.ok ? await res.json() : { entries: [] };
    entries = Array.isArray(data.entries) ? data.entries : [];
  } catch (e) {
    entries = [];
  }

  // One-time per-device migration: this browser may still have coffees
  // saved from before accounts were wired up (local storage only, never
  // synced). If the account has nothing yet, pull those in so they aren't
  // stranded on this one device.
  if (entries.length === 0) {
    try {
      const local = await window.storage.get(STORAGE_KEY, false);
      const localEntries = local ? JSON.parse(local.value) : [];
      if (Array.isArray(localEntries) && localEntries.length) {
        entries = localEntries;
        await persist(entries);
        showToast(`Imported ${localEntries.length} coffee${localEntries.length === 1 ? "" : "s"} saved on this device`);
      }
    } catch (e) {}
  }

  // Coffees only get a rating once a cup is logged. Clear the old default
  // rating from any entry that has no cups yet.
  let normalized = false;
  entries.forEach((e) => {
    if (Array.isArray(e.cupLog) && e.cupLog.length === 0 && e.rating != null) {
      e.rating = null; normalized = true;
    }
  });
  if (normalized) persist(entries);

  if (applyAutoStatusTransitions()) {
    persist(entries);
  }
  return true;
}

async function persist(next) {
  entries = next;
  try {
    const res = await fetch("/api/coffees", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ entries: next }),
    });
    if (res.status === 401) { goToLogin(); return; }
    if (!res.ok) showToast("Couldn't save — try again", true);
  } catch (e) {
    showToast("Couldn't save — try again", true);
  }
}

function showToast(msg, isError) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = "toast visible" + (isError ? " toast-error" : "");
  toastTimer = setTimeout(() => { toastEl.className = "toast"; }, 2200);
}

/* ---------- data ops ---------- */

function allTastingNotes() {
  const s = new Set();
  (entries || []).forEach((e) => (e.tastingNotes || []).forEach((t) => s.add(t)));
  return Array.from(s).sort();
}

function saveDraftEntry() {
  if (!draft.name.trim()) {
    const nameInput = document.getElementById("f-name");
    if (nameInput) { nameInput.style.borderColor = "var(--low)"; nameInput.focus(); }
    return;
  }
  const finalEntry = { ...draft, rating: (draft.rating === null || draft.rating === undefined || draft.rating === "") ? null : (parseFloat(draft.rating) || null) };
  let next;
  if (finalEntry.id) {
    next = entries.map((e) => (e.id === finalEntry.id ? finalEntry : e));
    showToast("Entry updated");
  } else {
    next = [{ ...finalEntry, id: uid(), dateLogged: new Date().toISOString() }, ...entries];
    showToast("Entry saved");
  }
  persist(next);
  view = "overview"; editId = null; draft = null;
  render();
}

function deleteEntryById(id) {
  persist(entries.filter((e) => e.id !== id));
  showToast("Entry deleted");
  view = "overview"; editId = null; draft = null;
  render();
}

/* ---------- root render ---------- */

function render() {
  if (entries === null) {
    tabbarEl.style.display = "none";
    mainEl.innerHTML = '<div class="loading">Brewing your log…</div>';
    return;
  }
  tabbarEl.style.display = "flex";
  if (applyAutoStatusTransitions()) {
    persist(entries);
  }
  document.querySelectorAll("[data-view]").forEach((btn) => {
    const v = btn.dataset.view;
    const isActive = v === view || (v === "form-new" && view === "form" && !editId);
    btn.classList.toggle("active", isActive);
  });

  if (view === "overview") renderOverview();
  else if (view === "detail") renderDetail();
  else if (view === "form") renderForm();
  else if (view === "stats") renderStats();
}

/* ---------- overview ---------- */

let overviewState = { q: "", sort: "recent", roastFilter: "all" };

function renderOverview() {
  if (entries.length === 0) {
    mainEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">★★★★★</div>
        <h2>No coffees logged yet</h2>
        <p>Add your first bag to start building your log.</p>
        <button class="btn btn-primary" id="empty-add-btn">Add a coffee</button>
      </div>`;
    document.getElementById("empty-add-btn").addEventListener("click", () => openForm(null));
    return;
  }

  mainEl.innerHTML = `
    <div class="overview">
      <div class="controls">
        <div class="search-box">
          ${ICONS.search}
          <input id="search-input" placeholder="Search name, roaster, origin…" value="${escapeHtml(overviewState.q)}" />
        </div>
        <div class="control-row">
          <select id="sort-select">
            <option value="recent">Recently added</option>

          </section>`).join("")}
      </div>
    </div>`;

  document.getElementById("sort-select").value = overviewState.sort;
  document.getElementById("roast-select").value = overviewState.roastFilter;

  document.getElementById("search-input").addEventListener("input", (e) => {
    overviewState.q = e.target.value; updateCardList();
  });
  document.getElementById("sort-select").addEventListener("change", (e) => {
    overviewState.sort = e.target.value; updateCardList();
  });
  document.getElementById("roast-select").addEventListener("change", (e) => {
    overviewState.roastFilter = e.target.value; updateCardList();
  });

  document.getElementById("categories-wrap").addEventListener("click", (e) => {
    const card = e.target.closest(".coffee-card");
    if (card) openDetail(card.dataset.id);
  });

  updateCardList();
}

function updateCardList() {
  const { q, sort, roastFilter } = overviewState;

  function matches(e) {
    if (roastFilter !== "all" && e.roastLevel !== roastFilter) return false;
    if (!q.trim()) return true;
    const hay = `${e.name} ${e.company} ${e.originCountry}`.toLowerCase();
    return hay.includes(q.toLowerCase());
  }
  function sortList(list) {
    list = [...list];
    if (sort === "recent") list.sort((a, b) => (b.dateLogged || "").localeCompare(a.dateLogged || ""));
    if (sort === "rating-high") list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    if (sort === "rating-low") list.sort((a, b) => (a.rating || 0) - (b.rating || 0));
    if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }

  STATUSES.forEach((status) => {
    const inCategory = entries.filter((e) => statusOf(e) === status);
    const filtered = sortList(inCategory.filter(matches));
    const countEl = document.getElementById(`count-${status.replace(/\s+/g, "-")}`);
    if (countEl) countEl.textContent = `(${inCategory.length})`;

    const container = document.querySelector(`.card-list[data-status-list="${status}"]`);
    if (!container) return;
    if (filtered.length === 0) {
      const label = STATUS_LABELS[status] || status;
      container.innerHTML = inCategory.length === 0
        ? `<p class="no-results">Nothing in ${label} yet.</p>`
        : `<p class="no-results">No matches in ${label}.</p>`;
      return;
    }
    container.innerHTML = filtered.map(renderCard).join("");
  });
}

function renderCard(e) {
  const thumbSrc = (e.photoThumbs && e.photoThumbs[0]) || (e.photos && e.photos[0]);
  const thumb = thumbSrc
    ? `<img src="${thumbSrc}" alt="" />`
    : `<span>${escapeHtml((e.name || "?").slice(0, 1).toUpperCase())}</span>`;
  const thumbStyle = thumbSrc ? "" : `style="background:${ROAST_DOT[e.roastLevel] || "#999"}"`;
  const notesHtml = (e.tastingNotes || []).slice(0, 2).map((t) => `<span class="tag-note">${escapeHtml(t)}</span>`).join("");
  return `
    <button class="coffee-card" data-id="${e.id}">
      <div class="card-thumb" ${thumbStyle}>${thumb}</div>
      <div class="card-body">
        <div class="card-top">
          <h3>${escapeHtml(e.name || "Untitled")}</h3>
          <span class="card-rating" style="color:${ratingColor(e.rating)}">${e.rating ?? "–"}</span>
        </div>
        <p class="card-sub">${escapeHtml(e.company || "Unknown roaster")} · ${escapeHtml(e.originCountry || "Origin unknown")}</p>
        <div class="card-tags">
          <span class="tag-outline">${escapeHtml(e.roastLevel)}</span>
          <span class="tag-outline">${escapeHtml(e.type)}</span>
          ${notesHtml}
        </div>
      </div>
    </button>`;
}

function openDetail(id) {
  editId = id;
  view = "detail";
  render();
}

function openForm(id) {
  editId = id || null;
  const existing = id ? entries.find((e) => e.id === id) : null;
  draft = existing
    ? { ...existing, status: statusOf(existing), photos: [...(existing.photos || [])], photoThumbs: [...(existing.photoThumbs || existing.photos || [])], tastingNotes: [...(existing.tastingNotes || [])] }
    : emptyEntry();
  view = "form";
  render();
}

  const notesHtml = (entry.tastingNotes && entry.tastingNotes.length)

        <label class="field">
          <span class="field-label">Company / roaster</span>
          <input id="f-company" value="${escapeHtml(draft.company)}" />
        </label>
        <label class="field">
          <span class="field-label">Bought from</span>
          <input id="f-boughtFrom" value="${escapeHtml(draft.boughtFrom)}" placeholder="Roaster website, local shop…" />
        </label>
        <div class="field">
          <span class="field-label">Type</span>
          <div class="segmented" id="type-segmented">
            ${TYPES.map((t) => `<button type="button" class="seg${draft.type === t ? " active" : ""}" data-value="${t}">${t}</button>`).join("")}
          </div>
        </div>
        <div class="field-pair">
          <label class="field">
            <span class="field-label">Price</span>
            <div class="currency-input"><span>£</span><input id="f-price" type="number" step="0.01" min="0" value="${escapeHtml(draft.price)}" /></div>
          </label>
          <label class="field">
            <span class="field-label">Bag size (g)</span>
            <input id="f-bagSize" type="number" step="1" min="0" value="${escapeHtml(draft.bagSize)}" />
          </label>
        </div>
        <div class="field">
          <span class="field-label">Price per 100g</span>
          <div class="computed" id="price100g">${p100 != null ? `£${p100.toFixed(2)}` : "—"}</div>
        </div>
      </section>

      <section class="form-section">
        <h3>Bean &amp; roast</h3>
        <div class="field-pair">
          <label class="field">
            <span class="field-label">Origin country</span>
            <select id="f-originCountry">
              <option value="">Select…</option>
              ${COUNTRIES.map((c) => `<option value="${c}"${draft.originCountry === c ? " selected" : ""}>${c}</option>`).join("")}
            </select>
          </label>
          <label class="field">
            <span class="field-label">Region</span>
            <input id="f-originRegion" value="${escapeHtml(draft.originRegion)}" placeholder="Guji, Huila…" />
          </label>
        </div>
        <div class="field">
          <span class="field-label">Origin makeup</span>
          <div class="segmented" id="origin-segmented">
            <button type="button" class="seg${draft.singleOrigin ? " active" : ""}" data-value="single">Single origin</button>
            <button type="button" class="seg${!draft.singleOrigin ? " active" : ""}" data-value="blend">Blend</button>
          </div>
        </div>
        <label class="field" id="blend-mix-field" style="display:${draft.singleOrigin ? "none" : "flex"};">
          <span class="field-label">Blend mix</span>
          <input id="f-blendMix" value="${escapeHtml(draft.blendMix)}" placeholder="60% Brazil, 40% Colombia" />
        </label>
        <div class="field">
          <span class="field-label">Roast level</span>
          <div class="roast-scale" id="roast-scale">
            ${ROAST_LEVELS.map((r) => `
              <button type="button" class="roast-dot${draft.roastLevel === r ? " active" : ""}" data-value="${r}">
                <span class="dot" style="background:${ROAST_DOT[r]}"></span>
                <span class="roast-label">${r}</span>
              </button>`).join("")}
          </div>
        </div>
        <div class="field-pair">
          <label class="field">
            <span class="field-label">Processing</span>
            <select id="f-processing">
              ${PROCESSING.map((p) => `<option value="${p}"${draft.processing === p ? " selected" : ""}>${p}</option>`).join("")}
            </select>
          </label>
          <label class="field">
            <span class="field-label">Varietal</span>
            <input id="f-varietal" value="${escapeHtml(draft.varietal)}" placeholder="Heirloom, Bourbon…" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">Altitude (masl)</span>
          <input id="f-altitude" type="number" min="0" value="${escapeHtml(draft.altitude)}" />
        </label>
        <div class="field">
          <span class="field-label">Tasting notes</span>
          <div class="note-input-row">
            <input id="note-input" placeholder="Type a note and press enter" value="${escapeHtml(noteInputValue)}" />
            <button type="button" class="btn-small" id="note-add-btn">Add</button>
          </div>
          <div class="suggestions" id="note-suggestions"></div>
          <div class="note-pills" id="note-pills"></div>
        </div>
      </section>

      <section class="form-section">
        <h3>Coffee Status</h3>
        <label class="field">
          <span class="field-label">Status</span>
          <select id="f-status">
            ${STATUSES.map((s) => `<option value="${s}"${draft.status === s ? " selected" : ""}>${STATUS_LABELS[s] || s}</option>`).join("")}
          </select>
        </label>
      </section>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save entry</button>
        ${isEdit ? `<button type="button" class="btn btn-ghost-danger" id="delete-btn">${ICONS.trash} Delete entry</button>` : ""}
      </div>
    </form>`;

  renderPhotoRow();
  renderNotePills();
  renderNoteSuggestions();
  attachFormListeners(isEdit);
}

function renderPhotoRow() {
  const row = document.getElementById("photo-row");
  const thumbs = draft.photos.map((src, i) => `
    <div class="photo-thumb" data-index="${i}">
      <img src="${(draft.photoThumbs && draft.photoThumbs[i]) || src}" alt="" />
      <button type="button" class="photo-remove" data-index="${i}">${ICONS.x}</button>
    </div>`).join("");
  const addBtn = draft.photos.length < MAX_PHOTOS
    ? `<button type="button" class="photo-add" id="photo-add-btn">${ICONS.camera}<span>Add</span></button>` : "";
  row.innerHTML = thumbs + addBtn;

  const addBtnEl = document.getElementById("photo-add-btn");
  if (addBtnEl) addBtnEl.addEventListener("click", () => document.getElementById("photo-file-input").click());
  row.querySelectorAll(".photo-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.index, 10);
      draft.photos.splice(i, 1);
      if (draft.photoThumbs) draft.photoThumbs.splice(i, 1);
      renderPhotoRow();
    });
  });
}

function renderNotePills() {
  const el = document.getElementById("note-pills");
  el.innerHTML = draft.tastingNotes.map((n) => `
    <span class="note-pill">${escapeHtml(n)}<button type="button" class="note-remove" data-note="${escapeHtml(n)}">${ICONS.x}</button></span>
  `).join("");
  el.querySelectorAll(".note-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      draft.tastingNotes = draft.tastingNotes.filter((n) => n !== btn.dataset.note);
      renderNotePills();
    });
  });
}

function renderNoteSuggestions() {
  const el = document.getElementById("note-suggestions");
  const q = noteInputValue.trim().toLowerCase();
  if (!q) { el.innerHTML = ""; return; }
  const suggestions = allTastingNotes()
    .filter((n) => n.toLowerCase().includes(q) && !draft.tastingNotes.includes(n))
    .slice(0, 5);
  el.innerHTML = suggestions.map((s) => `<button type="button" data-note="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join("");
  el.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => addNote(btn.dataset.note));
  });
}

function addNote(value) {
  const v = (value ?? "").trim();
  if (!v || draft.tastingNotes.includes(v)) return;
  draft.tastingNotes.push(v);
  noteInputValue = "";
  document.getElementById("note-input").value = "";
  renderNotePills();
  renderNoteSuggestions();
}

function attachFormListeners(isEdit) {
  document.getElementById("form-back").addEventListener("click", () => {
    view = "overview"; editId = null; draft = null; render();
  });

  document.getElementById("entry-form").addEventListener("submit", (e) => {
    e.preventDefault();
    saveDraftEntry();
  });

  document.getElementById("f-status").addEventListener("change", (e) => { draft.status = e.target.value; });
  document.getElementById("f-name").addEventListener("input", (e) => {
    draft.name = e.target.value; e.target.style.borderColor = "";
  });
  document.getElementById("f-company").addEventListener("input", (e) => { draft.company = e.target.value; });
  document.getElementById("f-boughtFrom").addEventListener("input", (e) => { draft.boughtFrom = e.target.value; });

  document.getElementById("type-segmented").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    draft.type = btn.dataset.value;
    btn.parentElement.querySelectorAll(".seg").forEach((b) => b.classList.toggle("active", b === btn));
  });

  function updatePrice100g() {
    const p100 = pricePer100g(draft.price, draft.bagSize);
    document.getElementById("price100g").textContent = p100 != null ? `£${p100.toFixed(2)}` : "—";
  }
  document.getElementById("f-price").addEventListener("input", (e) => { draft.price = e.target.value; updatePrice100g(); });
  document.getElementById("f-bagSize").addEventListener("input", (e) => { draft.bagSize = e.target.value; updatePrice100g(); });

  document.getElementById("f-originCountry").addEventListener("change", (e) => { draft.originCountry = e.target.value; });
  document.getElementById("f-originRegion").addEventListener("input", (e) => { draft.originRegion = e.target.value; });

  document.getElementById("origin-segmented").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    draft.singleOrigin = btn.dataset.value === "single";
    btn.parentElement.querySelectorAll(".seg").forEach((b) => b.classList.toggle("active", b === btn));
    document.getElementById("blend-mix-field").style.display = draft.singleOrigin ? "none" : "flex";
  });
  const blendInput = document.getElementById("f-blendMix");
  if (blendInput) blendInput.addEventListener("input", (e) => { draft.blendMix = e.target.value; });

  document.getElementById("roast-scale").addEventListener("click", (e) => {
    const btn = e.target.closest(".roast-dot"); if (!btn) return;
    draft.roastLevel = btn.dataset.value;
    btn.parentElement.querySelectorAll(".roast-dot").forEach((b) => b.classList.toggle("active", b === btn));
  });

  document.getElementById("f-processing").addEventListener("change", (e) => { draft.processing = e.target.value; });
  document.getElementById("f-varietal").addEventListener("input", (e) => { draft.varietal = e.target.value; });
  document.getElementById("f-altitude").addEventListener("input", (e) => { draft.altitude = e.target.value; });

  const noteInput = document.getElementById("note-input");
  noteInput.addEventListener("input", (e) => { noteInputValue = e.target.value; renderNoteSuggestions(); });
  noteInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addNote(noteInputValue); }
  });
  document.getElementById("note-add-btn").addEventListener("click", () => addNote(noteInputValue));

  document.getElementById("photo-file-input").addEventListener("change", async (e) => {
    const files = e.target.files;
    if (!files.length) return;
    const errorEl = document.getElementById("photo-error");
    errorEl.style.display = "none";
    const room = MAX_PHOTOS - draft.photos.length;
    if (room <= 0) { errorEl.textContent = `Up to ${MAX_PHOTOS} photos`; errorEl.style.display = "block"; return; }
    const picked = Array.from(files).slice(0, room);
    try {
      const pairs = await Promise.all(picked.map(resizeImageFile));
      if (!draft.photoThumbs) draft.photoThumbs = [];
      draft.photos.push(...pairs.map((p) => p.full));
      draft.photoThumbs.push(...pairs.map((p) => p.thumb));
      renderPhotoRow();
    } catch (err) {
      errorEl.textContent = "Couldn't process that photo";
      errorEl.style.display = "block";
    }
    e.target.value = "";
  });

  function addPhotoUrl() {
    const errorEl = document.getElementById("photo-error");
    const urlInput = document.getElementById("photo-url-input");
    const url = urlInput.value.trim();
    errorEl.style.display = "none";
    if (!url) return;
    const room = MAX_PHOTOS - draft.photos.length;
    if (room <= 0) { errorEl.textContent = `Up to ${MAX_PHOTOS} photos`; errorEl.style.display = "block"; return; }
    if (!/^https?:\/\//i.test(url)) {
      errorEl.textContent = "Enter a valid image URL starting with http(s)://";
      errorEl.style.display = "block";
      return;
    }
    if (!draft.photoThumbs) draft.photoThumbs = [];
    draft.photos.push(url);
    const insertedAt = draft.photos.length - 1;
    draft.photoThumbs.push(url); // placeholder until the resized thumb resolves
    urlInput.value = "";
    renderPhotoRow();
    makeThumbFromUrl(url).then((thumb) => {
      if (draft && draft.photoThumbs && draft.photoThumbs[insertedAt] !== undefined) {
        draft.photoThumbs[insertedAt] = thumb;
        if (view === "form") renderPhotoRow();
      }
    });
  }
  document.getElementById("photo-url-add-btn").addEventListener("click", addPhotoUrl);
  document.getElementById("photo-url-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addPhotoUrl(); }
  });

  if (isEdit) {
    const deleteBtn = document.getElementById("delete-btn");
    deleteBtn.addEventListener("click", () => {
      if (!confirmDeleteArmed) {
        confirmDeleteArmed = true;
        deleteBtn.textContent = "Tap again to confirm delete";
        deleteBtn.className = "btn btn-danger";
      } else {
        deleteEntryById(draft.id);
      }
    });
  }
}

/* ---------- stats ---------- */

function computeStats() {
  if (entries.length === 0) return null;
  const ratings = entries.filter((e) => e.rating != null).map((e) => e.rating);
  const avg = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null;

  const prices = entries.map((e) => pricePer100g(e.price, e.bagSize)).filter((v) => v != null);
  const avgPrice = prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : null;

  const byRoast = {};
  ROAST_LEVELS.forEach((r) => (byRoast[r] = []));
  entries.forEach((e) => { if (byRoast[e.roastLevel] && e.rating != null) byRoast[e.roastLevel].push(e.rating); });

  const byCompany = {};
  entries.forEach((e) => {
    const k = e.company || "Unknown";
    if (!byCompany[k]) byCompany[k] = [];
    byCompany[k].push(e.rating ?? null);
  });
  const topCompanies = Object.entries(byCompany)
    .map(([name, rs]) => {
      const rated = rs.filter((r) => r != null);
      return { name, count: rs.length, avg: rated.length ? rated.reduce((a, b) => a + b, 0) / rated.length : null };
    })
    .sort((a, b) => b.count - a.count).slice(0, 5);

  const noteCounts = {};
  entries.forEach((e) => (e.tastingNotes || []).forEach((n) => (noteCounts[n] = (noteCounts[n] || 0) + 1)));
  const topNotes = Object.entries(noteCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const buckets = [0, 0, 0, 0, 0];
  ratings.forEach((r) => { const idx = Math.min(4, Math.max(0, Math.floor((r - 1) / 2))); buckets[idx]++; });

  const beans = entries.filter((e) => e.type === "Whole Beans").length;
  const ground = entries.length - beans;

  return { avg, avgPrice, byRoast, topCompanies, topNotes, buckets, beans, ground, total: entries.length };
}

function renderStats() {
  const stats = computeStats();
  if (!stats) {
    mainEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">★★★★★</div>
        <h2>No stats yet</h2>
        <p>Log a coffee to start seeing your patterns.</p>
      </div>`;
    return;
  }

  const maxBucket = Math.max(...stats.buckets, 1);
  const maxRoast = Math.max(1, ...ROAST_LEVELS.map((r) => stats.byRoast[r].length));
  const maxNote = stats.topNotes.length ? stats.topNotes[0][1] : 1;

  const bucketRows = stats.buckets.map((v, i) => `
    <div class="bar-row">
      <span class="bar-label">${i * 2 + 1}–${i * 2 + 2}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(v / maxBucket) * 100}%"></div></div>
      <span class="bar-value">${v}</span>
    </div>`).join("");

  const roastRows = ROAST_LEVELS.map((r) => {
    const rs = stats.byRoast[r];
    const avg = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
    return `
      <div class="bar-row">
        <span class="bar-label">${r}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(rs.length / maxRoast) * 100}%; background:${ROAST_DOT[r]}"></div></div>
        <span class="bar-value">${rs.length ? avg.toFixed(1) : "–"}</span>
      </div>`;
  }).join("");

  const rosterRows = stats.topCompanies.map((c) => `
    <div class="roster-row">
      <span class="roster-name">${escapeHtml(c.name)}</span>
      <span class="roster-count">${c.count} ${c.count === 1 ? "bag" : "bags"}</span>
      <span class="roster-avg" style="color:${ratingColor(c.avg)}">${c.avg != null ? c.avg.toFixed(1) : "&#8212;"}</span>
    </div>`).join("");

  const noteCloud = stats.topNotes.map(([n, c]) => `
    <span class="cloud-tag" style="font-size:${0.75 + (c / maxNote) * 0.55}rem">${escapeHtml(n)}</span>`).join("");

  mainEl.innerHTML = `
    <div class="stats">
      <div class="hero-stats">
        <div class="hero-card"><span class="hero-num" style="color:${ratingColor(stats.avg)}">${stats.avg != null ? stats.avg.toFixed(1) : "&#8212;"}</span><span class="hero-label">Average rating</span></div>
        <div class="hero-card"><span class="hero-num">${stats.total}</span><span class="hero-label">Coffees logged</span></div>
        <div class="hero-card"><span class="hero-num">${stats.avgPrice != null ? `£${stats.avgPrice.toFixed(2)}` : "—"}</span><span class="hero-label">Avg. per 100g</span></div>
      </div>

      <section class="stat-block"><h3>Rating distribution</h3><div class="bar-chart">${bucketRows}</div></section>

      <section class="stat-block"><h3>Average rating by roast level</h3><div class="bar-chart">${roastRows}</div></section>

      <section class="stat-block">
        <h3>Beans vs ground</h3>
        <div class="split-bar">
          <div class="split-seg" style="flex:${stats.beans || 0.001}"><span>${stats.beans}</span></div>
          <div class="split-seg split-seg-alt" style="flex:${stats.ground || 0.001}"><span>${stats.ground}</span></div>
        </div>
        <div class="split-legend"><span>Whole beans</span><span>Ground</span></div>
      </section>

      ${stats.topCompanies.length > 0 ? `<section class="stat-block"><h3>Top roasters</h3><div class="roster-list">${rosterRows}</div></section>` : ""}

      ${stats.topNotes.length > 0 ? `<section class="stat-block"><h3>Most common tasting notes</h3><div class="note-cloud">${noteCloud}</div></section>` : ""}
    </div>`;
}

/* ---------- nav (sidebar + tabbar) ---------- */

document.body.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-view]");
  if (!btn || entries === null) return;
  const v = btn.dataset.view;
  if (v === "form-new") { openForm(null); return; }
  view = v; editId = null; draft = null;
  render();
});

/* ---------- init ---------- */

document.getElementById("sidebar-logout-btn").addEventListener("click", async () => {
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) {}
  location.href = "/login.html";
});

(async function init() {
  render();
  try {
    const me = await fetch("/api/auth/me");
    if (me.status === 401) { goToLogin(); return; }
  } catch (e) {}
  if (!(await loadEntries())) return;
  render();
})();
</script>
